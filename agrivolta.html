    <script>
        // Initialisation de la carte (vue centrée sur le monde)
        const map = L.map('map').setView([25.0, 10.0], 3);

        // Fond de carte OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const statusMsg = document.getElementById('status-msg');
        const siteCount = document.getElementById('site-count');

        /**
         * Parse un CSV simple (RFC 4180 light) : gère les guillemets et les virgules internes.
         */
        function parseCSV(text) {
            const rows = [];
            let row = [];
            let cell = '';
            let insideQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (insideQuotes) {
                    if (char === '"' && nextChar === '"') {
                        cell += '"';
                        i++;
                    } else if (char === '"') {
                        insideQuotes = false;
                    } else {
                        cell += char;
                    }
                } else {
                    if (char === '"') {
                        insideQuotes = true;
                    } else if (char === ',') {
                        row.push(cell.trim());
                        cell = '';
                    } else if (char === '\n' || char === '\r') {
                        if (cell !== '' || row.length > 0) {
                            row.push(cell.trim());
                            rows.push(row);
                            row = [];
                            cell = '';
                        }
                        if (char === '\r' && nextChar === '\n') i++;
                    } else {
                        cell += char;
                    }
                }
            }

            if (cell !== '' || row.length > 0) {
                row.push(cell.trim());
                rows.push(row);
            }

            return rows;
        }

        function rowsToSites(rows) {
            if (rows.length < 2) {
                throw new Error('Fichier CSV vide ou mal formaté');
            }

            const headers = rows[0].map(h => h.toLowerCase());
            const idx = name => headers.indexOf(name);

            const required = ['id','name','country','latitude','longitude','capacity_mwp','crop_type','pv_technology','status','year'];
            const missing = required.filter(h => idx(h) === -1);
            if (missing.length > 0) {
                throw new Error(`Colonnes manquantes dans le CSV : ${missing.join(', ')}`);
            }

            return rows.slice(1).map(row => ({
                id: parseInt(row[idx('id')], 10),
                name: row[idx('name')],
                country: row[idx('country')],
                lat: parseFloat(row[idx('latitude')]),
                lng: parseFloat(row[idx('longitude')]),
                capacity: parseFloat(row[idx('capacity_mwp')]),
                crop: row[idx('crop_type')],
                tech: row[idx('pv_technology')],
                status: row[idx('status')],
                year: row[idx('year')]
            })).filter(s => !isNaN(s.lat) && !isNaN(s.lng) && !isNaN(s.capacity));
        }

        // Fonction pour dimensionner le rayon du cercle selon la puissance (MWp)
        function getRadius(capacity) {
            return Math.max(Math.sqrt(capacity) * 2.5, 6);
        }

        function addMarkers(sites) {
            sites.forEach(site => {
                const circle = L.circleMarker([site.lat, site.lng], {
                    radius: getRadius(site.capacity),
                    fillColor: "#2e7d32",
                    color: "#1b5e20",
                    weight: 1.5,
                    opacity: 1,
                    fillOpacity: 0.7
                }).addTo(map);

                const popupContent = `
                    <div class="popup-title">${site.name}</div>
                    <div class="popup-detail">
                        <strong>Pays :</strong> ${site.country}<br>
                        <strong>Puissance :</strong> ${site.capacity} MWp<br>
                        <strong>Culture/Élevage :</strong> ${site.crop}<br>
                        <strong>Technologie PV :</strong> ${site.tech}<br>
                        <strong>Statut :</strong> ${site.status}<br>
                        <strong>Mise en service :</strong> ${site.year}
                    </div>
                `;

                circle.bindPopup(popupContent);
            });
        }

        function render(sites, source) {
            siteCount.textContent = `${sites.length} sites représentatifs`;
            if (source === 'embedded') {
                statusMsg.className = 'fallback';
                statusMsg.textContent = 'Mode hors-ligne : données embarquées dans la page.';
            }
            addMarkers(sites);
        }

        // Chargement dynamique du CSV (web) ou fallback sur les données embarquées (file://)
        fetch('agrivolta.csv')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} — impossible de charger agrivolta.csv`);
                }
                return response.text();
            })
            .then(text => render(rowsToSites(parseCSV(text)), 'fetch'))
            .catch(err => {
                console.warn('Fetch CSV échoué, fallback sur données embarquées :', err.message);
                const embedded = document.getElementById('embedded-csv');
                if (embedded && embedded.textContent.trim()) {
                    try {
                        const sites = rowsToSites(parseCSV(embedded.textContent));
                        render(sites, 'embedded');
                        return;
                    } catch (fallbackErr) {
                        console.error(fallbackErr);
                    }
                }
                console.error(err);
                siteCount.textContent = 'Erreur de chargement';
                statusMsg.className = 'error';
                statusMsg.textContent = err.message;
            });
    </script>
